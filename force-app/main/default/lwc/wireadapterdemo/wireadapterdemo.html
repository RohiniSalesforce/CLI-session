<template>
    <lightning-card title="Wire Adapter Demo where wire as a function">
        <div>User ID: {userID}</div>  
        <div class="slds-m-around_medium">
            <template if:true={userdetails}>
                <div>Email: {userdetails.email}</div>
                <div>Name: {userdetails.name}</div>
            </template>
            <template if:false={userdetails}>
                <p>Loading user details...</p>
            </template>
        </div>
    </lightning-card>
    <lightning-card title="Wire Adapter Demo where wire as a property">
        <div>User ID: {userID}</div>  
        <div class="slds-m-around_medium">
            <template if:true={userdetailsproperty.data}>
                <div>Email: {userdetailsproperty.data.fields.Email.value}</div>
                <div>Name: {userdetailsproperty.data.fields.Name.value}</div>
            </template>
            <template if:false={userdetails}>
                <p>Loading user details...</p>
            </template>
        </div>
    </lightning-card>
</template>
