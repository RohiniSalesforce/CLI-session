<template>
    <lightning-card title="Industry picklist">
        
        <div class="slds-m-around_medium">
            <lightning-combobox
                name="Industry"
                label="Industry"
                value={selectedIndustry}
                placeholder="Select Industry Value"
                options={Industryoption}
                onchange={handleChange}>
            </lightning-combobox>
        </div>
        <p> selected value: {selectedIndustry}</p>
    </lightning-card>

    <lightning-card title="Type picklist">
        
        <div class="slds-m-around_medium">
            <lightning-combobox
                name="Type"
                label="Type"
                value={selectedType}
                placeholder="Select Type Value"
                options={typeoption}
                onchange={handleTypeChange}>
            </lightning-combobox>
        </div>
        <p> selected value: {selectedType}</p>
    </lightning-card>
</template>
